services:
  backend:
    image: ${BACKEND_IMAGE:-heyyprakhar1/queuelessbharat-backend:eb}
    restart: unless-stopped
    environment:
      POSTGRES_SERVER: ${POSTGRES_SERVER:?Set POSTGRES_SERVER}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-queless_db}
      DATABASE_URL: ${DATABASE_URL:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_DATA: ${SEED_DATA:-false}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY}
      AUTH_ALGORITHM: ${AUTH_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set production ALLOWED_ORIGINS}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [queless-net]

  frontend:
    image: ${FRONTEND_IMAGE:-heyyprakhar1/queuelessbharat-frontend:eb}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [queless-net]

networks:
  queless-net:
    driver: bridge
