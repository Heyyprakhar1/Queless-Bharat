services:
  postgres:
    image: postgres:16-alpine
    container_name: queless-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-queless_db}
      POSTGRES_USER: ${POSTGRES_USER:-queless_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-queless_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-queless_user} -d $${POSTGRES_DB:-queless_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - queless-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: queless-backend:latest
    container_name: queless-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-queless_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-queless_password}
      POSTGRES_DB: ${POSTGRES_DB:-queless_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RUN_MIGRATIONS: "true"
      SEED_DATA: ${SEED_DATA:-false}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-insecure-secret-key-replace-in-production-min-32-chars-long!}
      AUTH_ALGORITHM: ${AUTH_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALLOWED_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:8080", "http://localhost:5173", "http://127.0.0.1:5173"]'
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - queless-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: queless-frontend:latest
    container_name: queless-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - queless-net

networks:
  queless-net:
    name: queless-network
    driver: bridge

volumes:
  postgres_data:
    name: queless-postgres-data
